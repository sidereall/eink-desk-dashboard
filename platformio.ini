; Smart Desk Dashboard - ESP32-C6 + WeAct 4.2" B/W e-ink (SSD1683)
[env:esp32-c6-devkitc-1]

; Community fork of the espressif32 platform, with support for the ESP32-C6.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip

board     = esp32-c6-devkitc-1
framework = arduino

; Decodes crash dumps into file names and line numbers, and timestamps the log.
monitor_speed   = 115200
monitor_filters = esp32_exception_decoder, time

; Must match the flash chip on the board.
board_upload.flash_size = 8MB
board_build.flash_size  = 8MB

; 3MB for the program, about 1MB for files.
board_build.partitions  = huge_app.csv

; Filesystem for the web page. Upload it with `pio run -t uploadfs`.
board_build.filesystem  = littlefs

; Routes Serial over the EPS32-C6's USB port.
build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DCORE_DEBUG_LEVEL=0

; Exact versions, so a library update can't change behaviour unnoticed.
lib_deps =
  zinggjm/GxEPD2 @ 1.6.9
  adafruit/Adafruit GFX Library @ 1.12.6
  adafruit/Adafruit BusIO @ 1.17.4
  bblanchon/ArduinoJson @ 7.4.3
